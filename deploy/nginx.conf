# Aviteus Healthcare: nginx config for the rebuilt site.
#
# HOT-FIX FOR THE CURRENT LIVE SITE (do this today, before the rebuild):
# the current menu links (/about-us, /contact-us...) return 404 because the
# pages exist only as /about-us.html. Inside the existing "location /" block add:
#     try_files $uri $uri.html $uri/ =404;
# then: sudo nginx -t && sudo systemctl reload nginx
#
# NEW SITE: upload dist/production/ to /var/www/aviteus/current/
# Keep the existing /files/ and /images/ folders from the old site in place.

limit_req_zone $binary_remote_addr zone=enquiry:10m rate=6r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name aviteushealthcare.co.uk;
    # ssl_certificate / ssl_certificate_key: keep your existing certificate lines

    root /var/www/aviteus/current;
    index index.html;
    charset utf-8;

    # Security headers. The site loads no third-party scripts unless analytics is switched on.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com; font-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Lead handler (server/lead_handler.py via systemd: deploy/aviteus-leads.service)
    location = /api/enquiry {
        limit_req zone=enquiry burst=5 nodelay;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    location = /api/health { proxy_pass http://127.0.0.1:8081; access_log off; }

    # Old URLs from the current site: permanent redirects
    location = /about-us            { return 301 /about-us/; }
    location = /about-us.html       { return 301 /about-us/; }
    location = /contact-us          { return 301 /contact-us/; }
    location = /contact-us.html     { return 301 /contact-us/; }
    location = /candidates          { return 301 /candidates/; }
    location = /candidates.html     { return 301 /candidates/; }
    location = /clients             { return 301 /hire-staff/; }
    location = /clients.html        { return 301 /hire-staff/; }
    location = /services            { return 301 /hire-staff/; }
    location = /services.html       { return 301 /hire-staff/; }
    location = /privacy-policy      { return 301 /privacy-policy/; }
    location = /privacy-policy.html { return 301 /privacy-policy/; }
    location = /index.html          { return 301 /; }

    # Thank-you and problem pages must never be cached with a reference in them
    location ^~ /thank-you/ { add_header Cache-Control "no-store" always; try_files $uri $uri/ =404; }

    location /files/  { try_files $uri =404; }
    location /assets/ { expires 30d; add_header Cache-Control "public"; }

    error_page 404 /404.html;
}

# One canonical host
server {
    listen 443 ssl;
    http2 on;
    server_name www.aviteushealthcare.co.uk;
    return 301 https://aviteushealthcare.co.uk$request_uri;
}
server {
    listen 80;
    server_name aviteushealthcare.co.uk www.aviteushealthcare.co.uk;
    return 301 https://aviteushealthcare.co.uk$request_uri;
}

